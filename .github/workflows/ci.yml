# CI (2026-10-21): unit tests that need no production data, plus frontend lint/build.
# The real database never leaves the server — scripts/deploy.sh runs the smoke test against it.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock pytest httpx
      - run: python -m pytest -q backend/tests/unit
        env:
          TZ: America/New_York

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/bootcheck.mjs && node scripts/bootcheck.mjs --authed   # does the build start?
